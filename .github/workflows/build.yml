name: Build JARVIS APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      -  name: Setup Android SDK
         uses: android-actions/setup-android@v3.2.1

      - name: Set local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Generate App Icons
        run: |
          pip install Pillow -q
          python3 generate_icons.py

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.6-bin.zip
          unzip -q gradle-8.6-bin.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.6/bin" >> $GITHUB_PATH

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon 2>&1 | tee build_output.txt
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "=== FULL ERROR ==="
            grep -A5 "FAILURE\|error:\|Error" build_output.txt | head -50
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
