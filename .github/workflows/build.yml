name: Build HENRY APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-henry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ensure ANDROID_SDK_ROOT and cmdline-tools
        run: |
          if [ -z "$ANDROID_SDK_ROOT" ]; then
            if [ -d "/usr/local/lib/android/sdk" ]; then
              echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
            else
              echo "ANDROID_SDK_ROOT=$HOME/Android/Sdk" >> $GITHUB_ENV
            fi
          fi
          echo "Using ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          if [ ! -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            TMPDIR=$(mktemp -d)
            cd "$TMPDIR"
            echo "Downloading Android commandline tools..."
            curl -sSL "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip" -o cmdline.zip
            unzip -q cmdline.zip
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            mv cmdline-tools/* "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
            rm -rf "$TMPDIR"
          fi
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: |
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses || true
          else
            echo "sdkmanager not found; skipping license acceptance"
          fi

      - name: Install required Android SDK packages
        run: |
          if command -v sdkmanager >/dev/null 2>&1; then
            sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" --sdk_root="$ANDROID_SDK_ROOT"
          else
            echo "sdkmanager not available"
            exit 1
          fi

      - name: Set local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Generate App Icons
        run: |
          python3 -m pip install --user Pillow -q
          python3 generate_icons.py || true

      - name: Download Gradle Wrapper JAR (only if missing)
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            mkdir -p gradle/wrapper
            curl -L -o gradle/wrapper/gradle-wrapper.jar "https://github.com/gradle/gradle/raw/v8.6.0/gradle/wrapper/gradle-wrapper.jar"
          else
            echo "gradle-wrapper.jar already present"
          fi

      - name: Grant gradlew permission
        run: chmod +x gradlew

      # 🔑 FIX: Create debug.keystore if it doesn't exist
      - name: Generate Debug Keystore
        run: |
          if [ ! -f debug.keystore ]; then
            echo "Generating debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          # Also place in app/ directory in case gradle looks there
          mkdir -p app
          cp debug.keystore app/debug.keystore 2>/dev/null || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HENRY-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Show APK info
        run: |
          echo "✅ HENRY APK built successfully"
          ls -lh app/build/outputs/apk/debug/app-debug.apk || true
