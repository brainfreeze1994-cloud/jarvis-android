plugins {
    id 'com.android.application'
}

// Stable release signing. CI decrypts the committed, passphrase-protected keystore and
// exports these variables (see .github/workflows/build.yml). When they're absent (local
// builds, or before the one-time key generation), we fall back to the debug key so the
// project still builds — but only the real key gives a signature that stays the same
// across builds, which is what lets updates install over old versions and lets Play
// Protect / Google's developer verification recognise the app.
def henryKeystorePath = System.getenv("HENRY_KEYSTORE_PATH")
def henryHasReleaseKey = henryKeystorePath != null && new File(henryKeystorePath).exists()

android {
    namespace 'com.jarvis.ai'
    compileSdk 34

    defaultConfig {
        applicationId "com.jarvis.ai"
        minSdk 24
        targetSdk 34
        // Monotonically increasing per CI run so each build is a valid update over the last.
        versionCode Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")
        versionName "23.0.0"
    }

    signingConfigs {
        debugConfig {
            storeFile file("${rootDir}/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        if (henryHasReleaseKey) {
            releaseConfig {
                storeFile file(henryKeystorePath)
                storePassword System.getenv("HENRY_KEYSTORE_PASSWORD")
                keyAlias System.getenv("HENRY_KEY_ALIAS") ?: "henry"
                keyPassword System.getenv("HENRY_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debugConfig
        }
        release {
            signingConfig henryHasReleaseKey ? signingConfigs.releaseConfig : signingConfigs.debugConfig
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            excludes += 'META-INF/DEPENDENCIES'
            excludes += 'META-INF/LICENSE'
            excludes += 'META-INF/LICENSE.txt'
            excludes += 'META-INF/NOTICE'
            excludes += 'META-INF/NOTICE.txt'
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
        disable 'WrongViewCast', 'DefaultLocale', 'HardcodedText', 'RtlSymmetry', 'RtlHardcoded'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.google.guava:guava:31.1-android'

    // Architecture Components: ViewModel & LiveData
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.6.2'

    // CameraX
    implementation 'androidx.camera:camera-core:1.3.1'
    implementation 'androidx.camera:camera-camera2:1.3.1'
    implementation 'androidx.camera:camera-lifecycle:1.3.1'
    implementation 'androidx.camera:camera-view:1.3.1'

    // ML Kit
    implementation 'com.google.mlkit:text-recognition:16.0.0'
    implementation 'com.google.mlkit:object-detection:17.0.0'
    implementation 'com.google.mlkit:face-detection:16.1.5'
    implementation 'com.google.mlkit:image-labeling:17.0.7'

    // Room Database
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // Lottie Animation
    implementation 'com.airbnb.android:lottie:6.4.0'

    // Google Maps SDK
    implementation 'com.google.android.gms:play-services-maps:18.2.0'
}

