android {
    namespace 'com.jarvis.ai'          // ← your REAL package
    compileSdk 34
    defaultConfig {
        applicationId "com.jarvis.ai"  // ← keep whatever yours was
        minSdk 24                      // ← can stay 24 if POI is removed
        targetSdk 34
    }
    // ... keep your buildTypes/compileOptions ...
    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE.txt'
    }
}
dependencies {
    // keep your existing deps incl. MPAndroidChart + jitpack
    // DELETE the two org.apache.poi lines unless you truly want local Excel
}
